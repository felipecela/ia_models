litellm_settings:
  drop_params: true                # (tuya) descarta params no soportados
  num_retries: 2                   # (mía)  reintentos por petición
  request_timeout: 600             # (mía)  modelos locales lentos: 10 min
  fallbacks:                       # (mía)  degradación automática
    - instantaneo: ["agil"]
    - codigo: ["instantaneo"]
    - agil: ["instantaneo"]
    - orquestador: ["instantaneo"]
    # Con Ollama reactivado, añade:
    # - profundo: ["instantaneo", "agil"]
    # - masivo: ["profundo", "instantaneo"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # inyectada por Autoboot V56
                                              # (sk-litellm-local, coincide con
                                              #  el apiKey registrado en OpenClaw)
