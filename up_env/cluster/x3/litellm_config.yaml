# ═══════════════════════════════════════════════════════════════════════════
# LiteLLM Gateway — OMEN AI Cluster V56 (config consolidada)
# ═══════════════════════════════════════════════════════════════════════════
# Fusión de:
#   • litellm_config-2.yaml (versión Felipe, V55)
#   • litellm_config.yaml   (versión propuesta previa, V12)
#
# INVENTARIO REAL (inventario_de_modelos.sh, jun-2026):
#   ✔ llama-3.1-8b-awq        5.4G  → SGLang   :30000  (modo --sglang)
#   ✔ llama-3.1-8b-exl2       6.3G  → TabbyAPI :5000   (modo --exl2)
#   ✔ qwen2.5-coder-7b-exl2   6.5G  → TabbyAPI :5000   (modo --exl2)
#   ✘ Contenedores ollama-gpu-main / ollama-cpu-router: NO EXISTEN
#     → Sus modelos quedan COMENTADOS. Descoméntalos si vuelves a
#       desplegar Ollama (o arranca sin --no-ollama y re-descarga).
#
# NOTA VRAM: TabbyAPI y SGLang no conviven con VRAM completa (8 GB).
#   Los fallbacks entre 'instantaneo/codigo' (EXL2) y 'agil' (AWQ) solo
#   funcionan si ambos motores están arriba (--sglang con mem-frac 0.15).
# NOTA CONTEXTO: TabbyAPI arranca con --max-seq-len 2048 en el autoboot;
#   sube ese valor si necesitas contextos largos en los EXL2.
# ═══════════════════════════════════════════════════════════════════════════

model_list:

  # ───────────────────────────────────────────────────────────────────────
  # MOTORES NATIVOS (instalados — únicos activos)
  # ───────────────────────────────────────────────────────────────────────
  - model_name: llama-3.1-8b-awq
    litellm_params:
      model: openai/meta-llama/Meta-Llama-3.1-8B-Instruct
      api_base: http://host.docker.internal:30000/v1
      api_key: "none"            # SGLang local sin auth
      temperature: 0.1

  - model_name: llama-3.1-8b-exl2
    litellm_params:
      model: openai/llama-3.1-8b-exl2
      api_base: http://host.docker.internal:5000/v1
      api_key: "none"            # si TabbyAPI tiene auth, usa el token de api_tokens.yml
      temperature: 0.1

  - model_name: qwen2.5-coder-7b-exl2
    litellm_params:
      model: openai/qwen2.5-coder-7b-exl2
      api_base: http://host.docker.internal:5000/v1
      api_key: "none"
      temperature: 0.1

  # ───────────────────────────────────────────────────────────────────────
  # ALIAS SEMÁNTICOS (niveles de routing — lo que OpenClaw debe usar)
  # Mismo backend físico, nombre estable: puedes cambiar el modelo
  # subyacente sin tocar OpenClaw.
  # ───────────────────────────────────────────────────────────────────────
  - model_name: instantaneo          # respuestas generales rápidas (EXL2)
    litellm_params:
      model: openai/llama-3.1-8b-exl2
      api_base: http://host.docker.internal:5000/v1
      api_key: "none"
      temperature: 0.1

  - model_name: codigo               # programación (EXL2)
    litellm_params:
      model: openai/qwen2.5-coder-7b-exl2
      api_base: http://host.docker.internal:5000/v1
      api_key: "none"
      temperature: 0.1

  - model_name: agil                 # alto throughput / batch (SGLang AWQ)
    litellm_params:
      model: openai/meta-llama/Meta-Llama-3.1-8B-Instruct
      api_base: http://host.docker.internal:30000/v1
      api_key: "none"
      temperature: 0.1

  - model_name: orquestador          # clasificación/planificación ligera
    litellm_params:                  # (sin phi4-mini instalado → llama 8B EXL2)
      model: openai/llama-3.1-8b-exl2
      api_base: http://host.docker.internal:5000/v1
      api_key: "none"
      temperature: 0.0

  # ───────────────────────────────────────────────────────────────────────
  # OLLAMA GPU :11434 — COMENTADO (contenedor no existe actualmente)
